<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stockfish Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <div class="player-bar">
      <div class="player-info">
        <span class="player-icon" id="engine-icon"></span>
        <span class="player-name">Stockfish</span>
        <span class="player-elo">(19)</span>
      </div>
      <div class="timer" id="engine-timer">&#8734;</div>
    </div>
    <div class="board" id="board"></div>
    <div class="player-bar">
      <div class="player-info">
        <span class="player-icon" id="human-icon"></span>
        <span class="player-name">You</span>
      </div>
      <div class="timer" id="human-timer">&#8734;</div>
    </div>
    <div class="status" id="status">White to move</div>
    <div class="controls">
      <button id="newgame" type="button">New game</button>
      <button id="flip" type="button">Flip board</button>
      <label class="field">Depth
        <input id="depth" type="number" min="1" max="20" value="8">
      </label>
      <label class="field">Play as
        <select id="side">
          <option value="w">White</option>
          <option value="b">Black</option>
        </select>
      </label>
    </div>
    <div class="movelog" id="movelog"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
