<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stockfish Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Stockfish</h1>
      <p class="subtitle">Play against the engine in your browser</p>
    </header>
    <div class="board" id="board"></div>
    <div class="status" id="status">White to move</div>
    <div class="controls">
      <button id="newgame" type="button">New game</button>
      <button id="flip" type="button">Flip board</button>
      <label class="field">Depth
        <input id="depth" type="number" min="1" max="20" value="8">
      </label>
      <label class="field">Play as
        <select id="side">
          <option value="w">White</option>
          <option value="b">Black</option>
        </select>
      </label>
    </div>
    <div class="movelog" id="movelog"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
